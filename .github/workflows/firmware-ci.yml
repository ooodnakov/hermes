name: Firmware and host validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO and host test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio==6.2.0 pytest
          python -m pip install -r requirements-host.txt

      - name: Build V1 familiar, V1 diagnostic, and legacy 2.8 firmware
        run: |
          pio --version
          pio run -e waveshare_esp32_s3_touch_lcd_349_v1
          pio run -e waveshare_esp32_s3_touch_lcd_349_v1_diagnostic
          pio run -e waveshare_esp32_s3_touch_lcd_28

      - name: Run complete host suite
        run: python -m pytest tests/ -q

      - name: Package named firmware images and build metadata
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/espherm-firmware
        run: |
          set -euo pipefail
          mkdir -p "$PACKAGE_ROOT"

          package_firmware() {
            local environment="$1"
            local artifact="$2"
            local filename="$3"
            local destination="$PACKAGE_ROOT/$artifact"
            mkdir -p "$destination"
            cp ".pio/build/$environment/firmware.bin" "$destination/$filename"
            {
              printf 'Environment: %s\n' "$environment"
              printf 'Git commit: %s\n' "$GITHUB_SHA"
              printf 'Image type: application firmware.bin only; bootloader and partition table are not included.\n'
              pio --version
              printf '\nResolved PlatformIO packages:\n'
              pio pkg list -e "$environment" | sed -E 's/ \(required:.*\)$//'
            } > "$destination/BUILD_INFO.txt"
            (cd "$destination" && sha256sum "$filename" > SHA256SUMS)
          }

          package_firmware waveshare_esp32_s3_touch_lcd_349_v1 \
            firmware-349-v1 firmware-349-v1.bin
          package_firmware waveshare_esp32_s3_touch_lcd_349_v1_diagnostic \
            firmware-349-v1-diagnostic firmware-349-v1-diagnostic.bin
          package_firmware waveshare_esp32_s3_touch_lcd_28 \
            firmware-legacy-28 firmware-legacy-2.8.bin

      - name: Package and verify complete V1 release bundle
        env:
          BUNDLE_ROOT: dist/ci-waveshare-349-v1
        run: |
          set -euo pipefail
          python scripts/package_v1_release.py --out "$BUNDLE_ROOT"
          python - "$BUNDLE_ROOT" <<'PY'
          import filecmp
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("profile") != "waveshare-esp32-s3-touch-lcd-349-v1":
              raise SystemExit("unexpected release bundle profile")
          source = manifest["source"]
          if source["commit"] != os.environ["GITHUB_SHA"] or source["dirty"]:
              raise SystemExit("release bundle source is not the clean workflow checkout")

          records = manifest.get("files", [])
          by_path = {record["path"]: record for record in records}
          if len(by_path) != len(records):
              raise SystemExit("duplicate paths in release manifest")
          actual_paths = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and path != root / "manifest.json"
          }
          if actual_paths != set(by_path):
              raise SystemExit("release manifest file list does not match bundle contents")

          for relative, record in by_path.items():
              path = (root / relative).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"invalid release manifest path: {relative}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if path.stat().st_size != record["size_bytes"] or digest != record["sha256"]:
                  raise SystemExit(f"release manifest size/hash mismatch: {relative}")

          firmware = manifest["firmware"]
          firmware_record = by_path[firmware["path"]]
          if (firmware_record["size_bytes"] != firmware["size_bytes"]
                  or firmware_record["sha256"] != firmware["sha256"]):
              raise SystemExit("firmware metadata does not match the packaged image")
          build_image = Path(".pio/build/waveshare_esp32_s3_touch_lcd_349_v1/firmware.bin")
          if not filecmp.cmp(root / firmware["path"], build_image, shallow=False):
              raise SystemExit("release application differs from the V1 build image")
          assets = manifest["sd_assets"]
          frames = assets["frames"]
          if (assets["frame_count"] != 20 or len(frames) != 20
                  or any(frame["size_bytes"] != 640 * 172 // 2 for frame in frames)):
              raise SystemExit("unexpected V1 SD asset frame metadata")
          for frame in frames:
              frame_record = by_path[f'{assets["directory"]}/{frame["path"]}']
              if (frame_record["size_bytes"] != frame["size_bytes"]
                      or frame_record["sha256"] != frame["sha256"]):
                  raise SystemExit(f"SD frame metadata mismatch: {frame['path']}")
          print(f"Verified {len(records)} release files and {assets['frame_count']} SD frames")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-349-v1
          path: ${{ runner.temp }}/espherm-firmware/firmware-349-v1/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-349-v1-diagnostic
          path: ${{ runner.temp }}/espherm-firmware/firmware-349-v1-diagnostic/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-legacy-28
          path: ${{ runner.temp }}/espherm-firmware/firmware-legacy-28/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: hermes-familiar-waveshare-349-v1-release
          path: dist/ci-waveshare-349-v1/
          if-no-files-found: error
