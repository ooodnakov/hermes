[platformio]
boards_dir = boards

[env:waveshare_esp32_s3_touch_lcd_28]
; Keep the original Arduino 2.x-era build independent of the V1 core selection.
platform = espressif32 @ 6.3.2
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = huge_app.csv
build_src_filter = +<main.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  lovyan03/LovyanGFX @ ^1.2.7
  h2zero/NimBLE-Arduino @ ^2.3.6
  bblanchon/ArduinoJson @ ^7.0.0

[env:waveshare_esp32_s3_touch_lcd_349_v1]
; pioarduino bundles a compatible Arduino core, ESP-IDF, and Xtensa toolchain.
; This release provides Arduino-ESP32 3.3.0 / ESP-IDF 5.5.0.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = waveshare_esp32_s3_touch_lcd_349_v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_349_v1.csv
build_src_filter =
  -<*>
  +<boards/v1/familiar.cpp>
  +<audio/v1_es8311.cpp>
  +<display/axs15231b_display.cpp>
  +<input/axs15231b_touch.cpp>
  +<peripherals/sensors.cpp>
  +<protocol/ui_state.cpp>
  +<storage/v1_assets.cpp>
  +<ui/familiar_ui.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DESPHERM_BOARD_WAVESHARE_349_V1=1
lib_deps =
  lovyan03/LovyanGFX @ 1.2.30
  bblanchon/ArduinoJson @ 7.4.2

[env:waveshare_esp32_s3_touch_lcd_349_v1_diagnostic]
; Independent display/power/touch diagnostic remains available after the UI port.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30/platform-espressif32.zip
board = waveshare_esp32_s3_touch_lcd_349_v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_349_v1.csv
build_src_filter =
  -<*>
  +<boards/v1/diagnostic.cpp>
  +<display/axs15231b_display.cpp>
  +<input/axs15231b_touch.cpp>
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM
  -DESPHERM_BOARD_WAVESHARE_349_V1=1
lib_deps =
  lovyan03/LovyanGFX @ 1.2.30
  bblanchon/ArduinoJson @ 7.4.2
